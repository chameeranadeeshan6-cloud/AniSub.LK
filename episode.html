<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Episode | AniSub LK</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">AniSub <span>LK</span></a><nav><a href="index.html">Home</a></nav></header><main id="content"></main><footer>Only distribute files you own or have permission to share.</footer><script src="app.js"></script><script>
const p=new URLSearchParams(location.search),id=p.get('anime'),sn=Number(p.get('season')),en=Number(p.get('episode'));getData().then(d=>{const a=d.anime.find(x=>x.id===id),s=a?.seasons.find(x=>x.number===sn),e=s?.episodes.find(x=>x.number===en),el=document.getElementById('content');if(!a||!s||!e){el.innerHTML='<h2>Episode not found</h2><a href="index.html">Home</a>';return}document.title=a.title+' episode '+en;el.innerHTML=`<section class="hero"><h1>${esc(a.title)}</h1><p>Season ${sn} · Episode ${en}</p><p>${esc(e.title)}</p></section><section class="panel"><h2>Sinhala subtitle</h2><p>${esc(e.subtitle||'Coming soon')}</p>${e.file?`<p><a class="btn primary" href="${esc(e.file)}" target="_blank" rel="noopener">Download authorized subtitle</a></p>`:'<p class="muted">No subtitle file has been published yet.</p>'}<p><a href="anime.html?id=${encodeURIComponent(a.id)}">← Back to anime</a></p></section>`}).catch(()=>document.getElementById('content').textContent='Could not load episode.');
</script></body></html>
